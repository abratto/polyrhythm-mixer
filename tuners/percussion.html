<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Percussion Family Tuner</title>
<style>
body { font-family: system-ui, sans-serif; max-width: 680px; margin: 30px auto; background: #121214; color: #e0e0e6; padding: 0 16px; }
h1 { font-size: 20px; text-align: center; margin-bottom: 4px; }
p.subtitle { text-align: center; font-size: 13px; color: #888; margin-top: 0; margin-bottom: 24px; }
select { width: 100%; padding: 8px; font-size: 14px; border-radius: 6px; background: #1a1a22; color: #eee; border: 1px solid #333; margin-bottom: 20px; }
.param { margin: 12px 0; }
.param label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 2px; }
.param label span.name { font-weight: 700; }
.param label span.val { font-family: monospace; color: #7cf; }
input[type=range] { width: 100%; margin: 0; height: 4px; -webkit-appearance: none; appearance: none; background: #333; border-radius: 2px; outline: none; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #7cf; cursor: pointer; }
.glossary { font-size: 12px; color: #999; margin-top: -2px; margin-bottom: 12px; padding-left: 2px; border-left: 2px solid #333; padding: 6px 10px; background: #181820; border-radius: 4px; }
button { padding: 12px 0; font-size: 16px; font-weight: 700; border: none; border-radius: 6px; cursor: pointer; width: 100%; margin-bottom: 10px; }
#playBtn { background: #007bff; color: #fff; }
#playBtn:hover { background: #0056b3; }
#copyBtn { background: #2a2a36; color: #ccc; }
#copyBtn:hover { background: #3a3a4c; color: #fff; }
#codeArea { width: 100%; height: 180px; font-family: monospace; font-size: 11px; background: #0c0c10; color: #b4d; border: 1px solid #333; border-radius: 4px; padding: 8px; box-sizing: border-box; margin-top: 8px; white-space: pre; overflow: auto; display: none; }
#status { text-align: center; font-size: 12px; color: #888; margin-top: 16px; }
</style>
</head>
<body>
<h1>Percussion Family Tuner</h1>
<p class="subtitle">Metals, Bells, Woods, Shakers &amp; Noise</p>

<select id="instrumentSelect"></select>
<div id="params"></div>

<button id="playBtn">Play</button>
<button id="copyBtn">Copy as Code</button>
<pre id="codeArea"></pre>
<p id="status">Select an instrument to begin</p>

<script type="module">
import { instrumentData } from '../scripts/instrument-data.js';
import { instruments as synth } from '../scripts/instruments.js';
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

// ── Instruments loaded from instrument-data.js ──
const instruments = {};
Object.keys(instrumentData).filter(k => instrumentData[k].family === 'percussion').forEach(k => {
  const src = instrumentData[k];
  instruments[k] = {
    label: src.label,
    params: src.params.map(p => ({
      key: p.k, label: p.label, unit: p.unit,
      min: p.lo, max: p.hi, step: p.step, val: p.v, gloss: p.gloss
    }))
  };
});

// ── Populate dropdown ──
const sel = document.getElementById('instrumentSelect');
Object.keys(instruments).forEach(key => {
  const opt = document.createElement('option');
  opt.value = key;
  opt.textContent = instruments[key].label;
  sel.appendChild(opt);
});

const paramsDiv = document.getElementById('params');
const sliders = {};
let currentInstrument = null;

function loadInstrument(key) {
  currentInstrument = key;
  const data = instruments[key];

  Object.keys(sliders).forEach(k => delete sliders[k]);
  paramsDiv.innerHTML = '';

  data.params.forEach(p => {
    const div = document.createElement('div');
    div.className = 'param';

    const label = document.createElement('label');
    const nameSpan = document.createElement('span');
    nameSpan.className = 'name';
    nameSpan.textContent = p.label;
    const valSpan = document.createElement('span');
    valSpan.className = 'val';
    valSpan.textContent = p.val + (p.unit ? ' ' + p.unit : '');
    label.appendChild(nameSpan);
    label.appendChild(valSpan);

    const input = document.createElement('input');
    input.type = 'range';
    input.min = p.min;
    input.max = p.max;
    input.step = p.step;
    input.value = p.val;

    const gloss = document.createElement('div');
    gloss.className = 'glossary';
    gloss.textContent = p.gloss;

    sliders[p.key] = { input, valSpan, unit: p.unit };

    input.addEventListener('input', () => {
      valSpan.textContent = parseFloat(input.value) + (p.unit ? ' ' + p.unit : '');
      document.getElementById('status').textContent = 'Tweaking ' + data.label;
    });

    div.appendChild(label);
    div.appendChild(input);
    div.appendChild(gloss);
    paramsDiv.appendChild(div);
  });

  document.getElementById('status').textContent = data.label + ' loaded. Adjust sliders, then press Play.';
  document.getElementById('codeArea').style.display = 'none';
}

sel.addEventListener('change', () => loadInstrument(sel.value));
loadInstrument(sel.value);

// ── Play ──
// Preview through the REAL synth (scripts/instruments.js) so what you hear here
// is exactly what the app plays. The synth reads `instrumentData`, so we push
// the current slider values into it first.
document.getElementById('playBtn').addEventListener('click', async () => {
  if (!currentInstrument) return;
  if (audioCtx.state === 'suspended') await audioCtx.resume();

  const data = instrumentData[currentInstrument];
  data?.params?.forEach(p => {
    const s = sliders[p.k];
    if (s) p.v = parseFloat(s.input.value);
  });

  const fn = synth[currentInstrument];
  if (!fn) {
    document.getElementById('status').textContent = 'No synth for ' + currentInstrument;
    return;
  }
  fn({ audioCtx }, audioCtx.currentTime, 1.0, '');
  document.getElementById('status').textContent = 'Playing ' + instruments[currentInstrument].label;
});

// ── Copy as code ──
// Emits the current slider values as a `params:` block ready to paste over the
// instrument's entry in scripts/instrument-data.js.
document.getElementById('copyBtn').addEventListener('click', () => {
  if (!currentInstrument) return;
  const data = instruments[currentInstrument];
  const code = `  ${currentInstrument}: {\n    params: [\n` +
    data.params.map(p => {
      const val = parseFloat(sliders[p.key].input.value);
      const fields = [`k: ${JSON.stringify(p.key)}`, `v: ${val}`];
      if (p.section) fields.push(`section: ${JSON.stringify(p.section)}`);
      fields.push(
        `label: ${JSON.stringify(p.label)}`,
        `unit: ${JSON.stringify(p.unit || '')}`,
        `lo: ${p.min}`, `hi: ${p.max}`, `step: ${p.step}`,
        `gloss: ${JSON.stringify(p.gloss)}`
      );
      return `      { ${fields.join(', ')} },`;
    }).join('\n') +
    `\n    ]\n  },`;

  document.getElementById('codeArea').textContent = code;
  document.getElementById('codeArea').style.display = 'block';
  document.getElementById('status').textContent = 'Tuned params generated — paste into instrument-data.js.';
});
</script>
</body>
</html>
