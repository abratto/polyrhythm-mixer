<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hybrid Family Tuner</title>
<style>
body { font-family: system-ui, sans-serif; max-width: 720px; margin: 30px auto; background: #121214; color: #e0e0e6; padding: 0 16px; }
h1 { font-size: 20px; text-align: center; margin-bottom: 4px; }
p.subtitle { text-align: center; font-size: 13px; color: #888; margin-top: 0; margin-bottom: 24px; }
select { width: 100%; padding: 8px; font-size: 14px; border-radius: 6px; background: #1a1a22; color: #eee; border: 1px solid #333; margin-bottom: 20px; }
.section-title { font-size: 14px; font-weight: 700; color: #7cf; margin: 20px 0 6px; padding-bottom: 4px; border-bottom: 1px solid #333; text-transform: uppercase; letter-spacing: 0.5px; }
.param { margin: 10px 0; }
.param label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 2px; }
.param label span.name { font-weight: 700; }
.param label span.val { font-family: monospace; color: #7cf; }
input[type=range] { width: 100%; margin: 0; height: 4px; -webkit-appearance: none; appearance: none; background: #333; border-radius: 2px; outline: none; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #7cf; cursor: pointer; }
.glossary { font-size: 11px; color: #888; margin-top: -2px; margin-bottom: 8px; padding: 4px 8px; background: #181820; border-radius: 4px; border-left: 2px solid #444; }
button { padding: 12px 0; font-size: 16px; font-weight: 700; border: none; border-radius: 6px; cursor: pointer; width: 100%; margin-bottom: 10px; }
#playBtn { background: #007bff; color: #fff; }
#playBtn:hover { background: #0056b3; }
#copyBtn { background: #2a2a36; color: #ccc; }
#copyBtn:hover { background: #3a3a4c; color: #fff; }
textarea { width: 100%; height: 200px; font-family: monospace; font-size: 11px; background: #0c0c10; color: #b4d; border: 1px solid #333; border-radius: 4px; padding: 8px; box-sizing: border-box; margin-top: 8px; display: none; }
#status { text-align: center; font-size: 12px; color: #888; margin-top: 16px; }
</style>
</head>
<body>
<h1>Hybrid Family Tuner</h1>
<p class="subtitle">Bongos, Congas, Snare, Timbale, Synth Kick, Electronic Snare, Djembe, Frame Drum, Traditional Cajon, Snare Cajon</p>

<select id="instrumentSelect"></select>
<div id="params"></div>

<button id="playBtn">Play</button>
<button id="copyBtn">Copy as Code</button>
<textarea id="codeArea"></textarea>
<p id="status">Select an instrument to begin</p>

<script type="module">
import { instrumentData } from '../scripts/instrument-data.js';
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function acquireNoise(ctx) {
  const buf = (() => {
    const s = ctx.sampleRate;
    const b = state.audioCtx.createBuffer(1, s, s);
    const d = b.getChannelData(0);
    for (let i = 0; i < s; i++) d[i] = Math.random() * 2 - 1;
    return b;
  })();
  const src = state.audioCtx.createBufferSource();
  src.buffer = buf;
  return src;
}

// ── Instrument parameter database ──


// ── Instruments loaded from instrument-data.js ──
const instruments = {};
Object.keys(instrumentData).forEach(k => {
  const src = instrumentData[k];
  instruments[k] = {
    label: src.label,
    layers: [...new Set(src.params.map(p => p.section))],
    params: src.params.map(p => ({
      section: p.section,
      key: p.k, label: p.label, unit: p.unit,
      min: p.lo, max: p.hi, step: p.step, val: p.v, gloss: p.gloss
    }))
  };
});

// ── Populate dropdown ──
const sel = document.getElementById('instrumentSelect');
Object.keys(instruments).forEach(key => {
  const opt = document.createElement('option');
  opt.value = key;
  opt.textContent = instruments[key].label;
  sel.appendChild(opt);
});

const paramsDiv = document.getElementById('params');
const sliders = {};
let currentInstrument = null;

const SECTION_NAMES = { body: 'Body / Tone', overtone: 'Overtones', impact: 'Impact / Slap', noise: 'Noise / Snap', resonance: 'Resonance' };

function loadInstrument(key) {
  currentInstrument = key;
  const data = instruments[key];
  const usedSections = [...new Set(data.params.map(p => p.section))];
  
  paramsDiv.innerHTML = '';
  
  usedSections.forEach(section => {
    const title = document.createElement('div');
    title.className = 'section-title';
    title.textContent = SECTION_NAMES[section] || section;
    paramsDiv.appendChild(title);
    
    data.params.filter(p => p.section === section).forEach(p => {
      const div = document.createElement('div');
      div.className = 'param';
      
      const label = document.createElement('label');
      const nameSpan = document.createElement('span');
      nameSpan.className = 'name';
      nameSpan.textContent = p.label;
      const valSpan = document.createElement('span');
      valSpan.className = 'val';
      valSpan.textContent = p.val + (p.unit ? ' ' + p.unit : '');
      label.appendChild(nameSpan);
      label.appendChild(valSpan);
      
      const input = document.createElement('input');
      input.type = 'range';
      input.min = p.min;
      input.max = p.max;
      input.step = p.step;
      input.value = p.val;
      
      const gloss = document.createElement('div');
      gloss.className = 'glossary';
      gloss.textContent = p.gloss;
      
      sliders[p.key] = { input, valSpan, unit: p.unit };
      
      input.addEventListener('input', () => {
        valSpan.textContent = parseFloat(input.value) + (p.unit ? ' ' + p.unit : '');
        document.getElementById('status').textContent = 'Tweaking ' + data.label;
      });
      
      div.appendChild(label);
      div.appendChild(input);
      div.appendChild(gloss);
      paramsDiv.appendChild(div);
    });
  });
  
  document.getElementById('status').textContent = data.label + ' loaded. Adjust sliders, then press Play.';
  document.getElementById('codeArea').style.display = 'none';
}

sel.addEventListener('change', () => loadInstrument(sel.value));
loadInstrument(sel.value);

// ── Play ──
document.getElementById('playBtn').addEventListener('click', async () => {
  if (!currentInstrument) return;
  if (audioCtx.state === 'suspended') await audioCtx.resume();
  
  const v = {};
  Object.keys(sliders).forEach(key => { v[key] = parseFloat(sliders[key].input.value); });
  const now = audioCtx.currentTime;
  const vol = 1.0;
  
  if (currentInstrument === 'bongo_low' || currentInstrument === 'bongo_high') {
    const master = audioCtx.createGain();
    master.gain.setValueAtTime(vol, now);
    master.connect(audioCtx.destination);
    
    // 1. Fundamental
    const o1 = audioCtx.createOscillator();
    const g1 = audioCtx.createGain();
    o1.type = 'sine';
    o1.frequency.setValueAtTime(v.baseFreq * v.pitchBend, now);
    o1.frequency.exponentialRampToValueAtTime(v.baseFreq, now + 0.025);
    g1.gain.setValueAtTime(v.bodyVol, now);
    g1.gain.exponentialRampToValueAtTime(0.001, now + v.bodyDecay);
    o1.connect(g1); g1.connect(master);
    o1.start(now); o1.stop(now + v.bodyDecay);
    
    // 2. Overtone
    const o2 = audioCtx.createOscillator();
    const g2 = audioCtx.createGain();
    o2.type = 'triangle';
    o2.frequency.setValueAtTime(v.baseFreq * v.overRatio * v.pitchBend, now);
    o2.frequency.exponentialRampToValueAtTime(v.baseFreq * v.overRatio, now + 0.025);
    g2.gain.setValueAtTime(v.overVol, now);
    g2.gain.exponentialRampToValueAtTime(0.001, now + v.bodyDecay * v.overDecay);
    o2.connect(g2); g2.connect(master);
    o2.start(now); o2.stop(now + v.bodyDecay * v.overDecay);
    
    // 3. Impact noise
    const noise = acquireNoise(audioCtx);
    if (noise) {
      const nf = audioCtx.createBiquadFilter();
      nf.type = 'bandpass';
      nf.frequency.setValueAtTime(v.noiseFreq, now);
      nf.Q.setValueAtTime(v.noiseQ, now);
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(v.noiseVol, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + v.noiseDecay);
      noise.connect(nf); nf.connect(ng); ng.connect(master);
      noise.start(now);
    }
    master.gain.exponentialRampToValueAtTime(0.001, now + v.bodyDecay + 0.05);
  }
  
  else if (currentInstrument === 'synth_kick') {
    const sub = audioCtx.createOscillator();
    const sg = audioCtx.createGain();
    sub.type = 'sine';
    sub.frequency.setValueAtTime(v.bodyFreq, now);
    sub.frequency.exponentialRampToValueAtTime(v.bodyEndFreq, now + v.bodySweep);
    sg.gain.setValueAtTime(vol * v.bodyVol, now);
    sg.gain.exponentialRampToValueAtTime(0.001, now + v.bodyDecay);
    sub.connect(sg); sg.connect(audioCtx.destination);
    sub.start(now); sub.stop(now + v.bodyDecay);
    
    const noise = acquireNoise(audioCtx);
    if (noise) {
      const nf = audioCtx.createBiquadFilter();
      nf.type = 'bandpass';
      nf.frequency.setValueAtTime(v.clickFreq, now);
      nf.Q.setValueAtTime(v.clickQ, now);
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(vol * v.clickVol, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + v.clickDecay);
      noise.connect(nf); nf.connect(ng); ng.connect(audioCtx.destination);
      noise.start(now);
    }
  }
  
  else if (currentInstrument === 'snare' || currentInstrument === 'electronic_snare') {
    // Body oscillator
    const osc = audioCtx.createOscillator();
    const og = audioCtx.createGain();
    osc.type = currentInstrument === 'electronic_snare' ? 'sine' : 'triangle';
    if (currentInstrument === 'electronic_snare') {
      osc.frequency.setValueAtTime(v.bodyFreq, now);
      osc.frequency.exponentialRampToValueAtTime(v.bodyEndFreq, now + v.bodySweep);
    } else {
      osc.frequency.setValueAtTime(v.bodyFreq, now);
    }
    og.gain.setValueAtTime(vol * v.bodyVol, now);
    og.gain.exponentialRampToValueAtTime(0.001, now + v.bodyDecay);
    osc.connect(og); og.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + v.bodyDecay);
    
    // Noise
    const noise = acquireNoise(audioCtx);
    if (noise) {
      const nf = audioCtx.createBiquadFilter();
      const isBP = currentInstrument === 'electronic_snare';
      nf.type = isBP ? 'bandpass' : 'highpass';
      nf.frequency.setValueAtTime(v.noiseFreq, now);
      if (isBP) nf.Q.setValueAtTime(v.noiseQ, now);
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(vol * v.noiseVol, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + v.noiseDecay);
      noise.connect(nf); nf.connect(ng); ng.connect(audioCtx.destination);
      noise.start(now);
    }
  }
  
  else if (currentInstrument.startsWith('conga_')) {
    const master = audioCtx.createGain();
    master.gain.setValueAtTime(vol, now);
    master.connect(audioCtx.destination);
    
    // Fundamental
    const o1 = audioCtx.createOscillator();
    const g1 = audioCtx.createGain();
    o1.type = 'sine';
    o1.frequency.setValueAtTime(v.baseFreq * (v.bodyPitchBend || 1.2), now);
    o1.frequency.exponentialRampToValueAtTime(v.baseFreq, now + 0.03);
    g1.gain.setValueAtTime(v.bodyVol, now);
    g1.gain.exponentialRampToValueAtTime(0.001, now + v.bodyDecay);
    o1.connect(g1); g1.connect(master);
    o1.start(now); o1.stop(now + v.bodyDecay);
    
    // Overtone 1
    const o2 = audioCtx.createOscillator();
    const g2 = audioCtx.createGain();
    o2.type = 'triangle';
    o2.frequency.setValueAtTime(v.baseFreq * v.overRatio1, now);
    g2.gain.setValueAtTime(v.overVol1, now);
    g2.gain.exponentialRampToValueAtTime(0.001, now + v.bodyDecay * 0.8);
    o2.connect(g2); g2.connect(master);
    o2.start(now); o2.stop(now + v.bodyDecay * 0.8);
    
    if (v.overRatio2) {
      const o3 = audioCtx.createOscillator();
      const g3 = audioCtx.createGain();
      o3.type = 'triangle';
      o3.frequency.setValueAtTime(v.baseFreq * v.overRatio2, now);
      g3.gain.setValueAtTime(v.overVol2, now);
      g3.gain.exponentialRampToValueAtTime(0.001, now + v.bodyDecay * 0.6);
      o3.connect(g3); g3.connect(master);
      o3.start(now); o3.stop(now + v.bodyDecay * 0.6);
    }
    
    slap: if (v.slapFreq) {
      const noise = acquireNoise(audioCtx);
      if (!noise) break slap;
      const nf = audioCtx.createBiquadFilter();
      nf.type = 'bandpass';
      nf.frequency.setValueAtTime(v.slapFreq, now);
      if (v.slapQ) nf.Q.setValueAtTime(v.slapQ, now);
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(vol * v.slapVol, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + v.slapDecay);
      noise.connect(nf); nf.connect(ng); ng.connect(master);
      noise.start(now);
    }
    master.gain.exponentialRampToValueAtTime(0.001, now + v.bodyDecay + 0.05);
  }
  
  else if (currentInstrument === 'timbale') {
    const osc = audioCtx.createOscillator();
    const og = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(v.bodyFreq, now);
    osc.frequency.exponentialRampToValueAtTime(v.bodyEndFreq, now + v.bodySweep);
    og.gain.setValueAtTime(0.001, now);
    og.gain.linearRampToValueAtTime(vol * v.bodyVol, now + 0.003);
    og.gain.exponentialRampToValueAtTime(0.001, now + v.bodyDecay);
    osc.connect(og); og.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + v.bodyDecay);
    
    const noise = acquireNoise(audioCtx);
    if (noise) {
      const nf = audioCtx.createBiquadFilter();
      nf.type = 'highpass';
      nf.frequency.setValueAtTime(v.noiseFreq, now);
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(vol * v.noiseVol, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + v.noiseDecay);
      noise.connect(nf); nf.connect(ng); ng.connect(audioCtx.destination);
      noise.start(now);
    }
  }
  
  else if (currentInstrument === 'cajon_trad_bass' || currentInstrument === 'cajon_snare_bass') {
    const mg = audioCtx.createGain();
    mg.gain.setValueAtTime(vol, now);
    mg.connect(audioCtx.destination);
    
    const cav = audioCtx.createOscillator();
    const cg = audioCtx.createGain();
    cav.type = 'sine';
    cav.frequency.setValueAtTime(v.cavityFreq, now);
    cg.gain.setValueAtTime(v.cavityVol, now);
    cg.gain.exponentialRampToValueAtTime(0.001, now + v.cavityDecay);
    cav.connect(cg); cg.connect(mg);
    cav.start(now); cav.stop(now + v.cavityDecay);
    
    const wood = audioCtx.createOscillator();
    const wg = audioCtx.createGain();
    wood.type = 'triangle';
    wood.frequency.setValueAtTime(v.woodFreq, now);
    wg.gain.setValueAtTime(v.woodVol, now);
    wg.gain.exponentialRampToValueAtTime(0.001, now + v.woodDecay);
    wood.connect(wg); wg.connect(mg);
    wood.start(now); wood.stop(now + v.woodDecay);
    
    const pn = acquireNoise(audioCtx);
    if (pn) {
      const pf = audioCtx.createBiquadFilter();
      pf.type = 'lowpass';
      pf.frequency.setValueAtTime(v.palmFreq, now);
      const pg = audioCtx.createGain();
      pg.gain.setValueAtTime(v.palmVol, now);
      pg.gain.exponentialRampToValueAtTime(0.001, now + v.palmDecay);
      pn.connect(pf); pf.connect(pg); pg.connect(mg);
      pn.start(now);
    }
    
    if (currentInstrument === 'cajon_snare_bass' && v.snareFreq) {
      const sn = acquireNoise(audioCtx);
      if (sn) {
        const sf = audioCtx.createBiquadFilter();
        sf.type = 'highpass';
        sf.frequency.setValueAtTime(v.snareFreq, now);
        const sg = audioCtx.createGain();
        sg.gain.setValueAtTime(v.snareVol, now);
        sg.gain.exponentialRampToValueAtTime(0.001, now + v.snareDecay);
        sn.connect(sf); sf.connect(sg); sg.connect(mg);
        sn.start(now);
      }
    }
  }
  
  else if (currentInstrument === 'cajon_trad_slap' || currentInstrument === 'cajon_snare_slap' || currentInstrument === 'slap') {
    const noise = acquireNoise(audioCtx);
    if (noise) {
      const nf = audioCtx.createBiquadFilter();
      nf.type = 'bandpass';
      nf.frequency.setValueAtTime(v.noiseFreq, now);
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(vol * v.noiseVol, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + v.noiseDecay);
      noise.connect(nf); nf.connect(ng); ng.connect(audioCtx.destination);
      noise.start(now);
    }
    const osc = audioCtx.createOscillator();
    const og = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(v.bodyFreq, now);
    if (v.bodyEndFreq) osc.frequency.exponentialRampToValueAtTime(v.bodyEndFreq, now + v.bodySweep);
    og.gain.setValueAtTime(vol * v.bodyVol, now);
    og.gain.exponentialRampToValueAtTime(0.001, now + v.bodyDecay);
    osc.connect(og); og.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + v.bodyDecay);
  }
  
  document.getElementById('status').textContent = 'Playing ' + instruments[currentInstrument].label;
});

// ── Copy as code ──
document.getElementById('copyBtn').addEventListener('click', () => {
  if (!currentInstrument) return;
  const v = {};
  Object.keys(sliders).forEach(key => { v[key] = JSON.parse(JSON.stringify(parseFloat(sliders[key].input.value))); });
  
  let code = `// ${instruments[currentInstrument].label} — tuned values\n`;
  code += `function play${currentInstrument.replace(/_./g, m => m[1].toUpperCase()).replace(/^./, m => m.toUpperCase())}(state, now, vol` +
    (currentInstrument === 'bongo_low' || currentInstrument === 'bongo_high' || currentInstrument.startsWith('conga_') || currentInstrument === 'timbale' || currentInstrument.startsWith('cajon_') ? ', channelName' : '') + `) {\n`;
  
  Object.keys(v).forEach(k => {
    code += `  // ${k} = ${v[k]}\n`;
  });
  
  code += `}\n`;
  
  document.getElementById('codeArea').value = code;
  document.getElementById('codeArea').style.display = 'block';
  document.getElementById('status').textContent = 'Placeholder generated. Copy and paste into instruments.js.';
});
</script>
</body>
</html>
