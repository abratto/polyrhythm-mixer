const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

// ── Reusable helpers ──
function acquireNoise(state) {
  const buf = (() => {
    const s = state.audioCtx.sampleRate;
    const b = state.audioCtx.createBuffer(1, s, s);
    const d = b.getChannelData(0);
    for (let i = 0; i < s; i++) d[i] = Math.random() * 2 - 1;
    return b;
  })();
  const src = state.audioCtx.createBufferSource();
  src.buffer = buf;
  return src;
}

      { section: 'body', key: 'bodySweep', label: 'Body Sweep', unit: 's', min: 0.005, max: 0.15, step: 0.001, val: 0.04, gloss: 'Pitch drop time.' },
      { section: 'body', key: 'bodyVol', label: 'Body Volume', unit: '', min: 0, max: 1, step: 0.01, val: 0.55, gloss: 'Body oscillator volume.' },
      { section: 'body', key: 'bodyDecay', label: 'Body Decay', unit: 's', min: 0.005, max: 0.15, step: 0.001, val: 0.06, gloss: 'Body decay.' }
    ]
  },
  djembe: {
    label: 'Djembe',
    layers: ['body', 'body', 'impact'],
    params: [
      { section: 'body', key: 'bassFreq', label: 'Bass Frequency', unit: 'Hz', min: 30, max: 120, step: 1, val: 55, gloss: 'Helmholtz cavity resonance (deep sub-bass).' },
      { section: 'body', key: 'bassPitchBend', label: 'Bass Pitch Bend', unit: '', min: 1.0, max: 1.4, step: 0.01, val: 1.1, gloss: 'Cavity pitch bend on impact.' },
      { section: 'body', key: 'bassVol', label: 'Bass Volume', unit: '', min: 0, max: 1, step: 0.01, val: 0.85, gloss: 'Sub-bass volume.' },
      { section: 'body', key: 'bassDecay', label: 'Bass Decay', unit: 's', min: 0.05, max: 0.8, step: 0.01, val: 0.45, gloss: 'Long decay for the booming open tone.' },
      { section: 'body', key: 'skinRatio', label: 'Skin Ratio', unit: '', min: 2.0, max: 8.0, step: 0.1, val: 5.5, gloss: 'Skin overtone = bassFreq × this value. Tight djembe skin is ~5-6×.' },
      { section: 'body', key: 'skinPitchBend', label: 'Skin Pitch Bend', unit: '', min: 1.0, max: 1.4, step: 0.01, val: 1.15, gloss: 'Skin pitch bend' },
      { section: 'body', key: 'skinVol', label: 'Skin Volume', unit: '', min: 0, max: 1, step: 0.01, val: 0.25, gloss: 'Skin triangle-wave volume.' },
      { section: 'body', key: 'skinDecay', label: 'Skin Decay', unit: 's', min: 0.03, max: 0.4, step: 0.01, val: 0.15, gloss: 'Faster skin decay.' },
      { section: 'impact', key: 'slapFreq', label: 'Slap Filter Freq', unit: 'Hz', min: 1000, max: 8000, step: 10, val: 4500, gloss: 'Bright slap transient frequency.' },
      { section: 'impact', key: 'slapQ', label: 'Slap Q', unit: '', min: 0.5, max: 3.0, step: 0.1, val: 1.2, gloss: 'Slap filter resonance.' },
      { section: 'impact', key: 'slapVol', label: 'Slap Volume', unit: '', min: 0, max: 1, step: 0.01, val: 0.5, gloss: 'Slap noise volume.' },
      { section: 'impact', key: 'slapDecay', label: 'Slap Decay', unit: 's', min: 0.005, max: 0.1, step: 0.001, val: 0.04, gloss: 'Slap transient duration.' }
    ]
  },
  frame_drum: {
    label: 'Frame Drum (Tar)',
    layers: ['body', 'overtone', 'impact'],
    params: [
      { section: 'body', key: 'baseFreq', label: 'Base Frequency', unit: 'Hz', min: 50, max: 200, step: 1, val: 95, gloss: 'Membrane fundamental. Frame drum lacks deep cavity — pure skin tone.' },
      { section: 'body', key: 'pitchBend', label: 'Pitch Bend', unit: '', min: 1.0, max: 1.8, step: 0.01, val: 1.4, gloss: 'Aggressive 40% pitch drop for that "thud/boing" stretch.' },
      { section: 'body', key: 'bodyVol', label: 'Body Volume', unit: '', min: 0, max: 1, step: 0.01, val: 0.8, gloss: 'Fundamental volume.' },
      { section: 'body', key: 'bodyDecay', label: 'Body Decay', unit: 's', min: 0.05, max: 0.5, step: 0.01, val: 0.22, gloss: 'Shorter sustain than djembe (shallow shell).' },
      { section: 'overtone', key: 'overRatio', label: 'Overtone Ratio', unit: '', min: 1.2, max: 2.5, step: 0.001, val: 1.593, gloss: 'Inharmonic Bessel ratio for the edge tone (triangle).' },
      { section: 'overtone', key: 'overPitchBend', label: 'Over. Pitch Bend', unit: '', min: 1.0, max: 1.6, step: 0.01, val: 1.3, gloss: 'Overtone pitch bend on impact.' },
      { section: 'overtone', key: 'overVol', label: 'Overtone Volume', unit: '', min: 0, max: 1, step: 0.01, val: 0.2, gloss: 'Overtone volume.' },
      { section: 'overtone', key: 'overDecayFactor', label: 'Over. Decay Factor', unit: '', min: 0.2, max: 1.0, step: 0.01, val: 0.6, gloss: 'Overtone = bodyDecay × this factor.' },
      { section: 'impact', key: 'noiseFreq', label: 'Transient Freq', unit: 'Hz', min: 500, max: 4000, step: 10, val: 1500, gloss: 'Softer mid-range flesh transient.' },
      { section: 'impact', key: 'noiseQ', label: 'Transient Q', unit: '', min: 0.5, max: 3.0, step: 0.1, val: 1.0, gloss: 'Transient filter Q.' },
      { section: 'impact', key: 'noiseVol', label: 'Transient Volume', unit: '', min: 0, max: 1, step: 0.01, val: 0.4, gloss: 'Flesh impact volume.' },
      { section: 'impact', key: 'noiseDecay', label: 'Transient Decay', unit: 's', min: 0.005, max: 0.08, step: 0.001, val: 0.02, gloss: 'Short finger/thumb transient.' }
    ]
  },
  synth_kick: {
    label: 'EDM Synth Kick',
    layers: ['body', 'noise'],
    params: [
      { section: 'body', key: 'bodyFreq', label: 'Sub Start Freq', unit: 'Hz', min: 30, max: 120, step: 1, val: 60, gloss: 'Low sub oscillator start.' },
      { section: 'body', key: 'bodyEndFreq', label: 'Sub End Freq', unit: 'Hz', min: 15, max: 80, step: 1, val: 30, gloss: 'Sub resting pitch.' },
      { section: 'body', key: 'bodySweep', label: 'Sub Sweep', unit: 's', min: 0.03, max: 0.4, step: 0.01, val: 0.2, gloss: 'Pitch drop duration (longer = deeper sub-bass sweep).' },
      { section: 'body', key: 'bodyVol', label: 'Sub Volume', unit: '', min: 0, max: 1, step: 0.01, val: 0.9, gloss: 'Sub oscillator volume.' },
      { section: 'body', key: 'bodyDecay', label: 'Sub Decay', unit: 's', min: 0.05, max: 0.5, step: 0.01, val: 0.25, gloss: 'Sub decay.' },
      { section: 'noise', key: 'clickFreq', label: 'Click BP Freq', unit: 'Hz', min: 500, max: 8000, step: 10, val: 4000, gloss: 'Bandpass centre for the attack click.' },
      { section: 'noise', key: 'clickQ', label: 'Click Q', unit: '', min: 0.5, max: 5.0, step: 0.1, val: 3.0, gloss: 'Click filter resonance.' },
      { section: 'noise', key: 'clickVol', label: 'Click Volume', unit: '', min: 0, max: 1, step: 0.01, val: 0.3, gloss: 'Click noise volume.' },
      { section: 'noise', key: 'clickDecay', label: 'Click Decay', unit: 's', min: 0.002, max: 0.06, step: 0.001, val: 0.01, gloss: 'Very short click transient.' }
    ]
  }
};

// ── Populate dropdown ──
const sel = document.getElementById('instrumentSelect');
Object.keys(instruments).forEach(key => {
  const opt = document.createElement('option');
  opt.value = key;
  opt.textContent = instruments[key].label;
  sel.appendChild(opt);
});

const paramsDiv = document.getElementById('params');
const sliders = {};
let currentInstrument = null;

const SECTION_NAMES = { body: 'Body / Tone', overtone: 'Overtones', impact: 'Impact / Slap', noise: 'Noise / Snap', resonance: 'Resonance' };

function loadInstrument(key) {
  currentInstrument = key;
  const data = instruments[key];
  const usedSections = [...new Set(data.params.map(p => p.section))];
  
  paramsDiv.innerHTML = '';
  
  usedSections.forEach(section => {
    const title = document.createElement('div');
    title.className = 'section-title';
    title.textContent = SECTION_NAMES[section] || section;
    paramsDiv.appendChild(title);
    
    data.params.filter(p => p.section === section).forEach(p => {
      const div = document.createElement('div');
      div.className = 'param';
      
      const label = document.createElement('label');
      const nameSpan = document.createElement('span');
      nameSpan.className = 'name';
      nameSpan.textContent = p.label;
      const valSpan = document.createElement('span');
      valSpan.className = 'val';
      valSpan.textContent = p.val + (p.unit ? ' ' + p.unit : '');
      label.appendChild(nameSpan);
      label.appendChild(valSpan);
      
      const input = document.createElement('input');
      input.type = 'range';
      input.min = p.min;
      input.max = p.max;
      input.step = p.step;
      input.value = p.val;
      
      const gloss = document.createElement('div');
      gloss.className = 'glossary';
      gloss.textContent = p.gloss;
      
      sliders[p.key] = { input, valSpan, unit: p.unit };
      
      input.addEventListener('input', () => {
        valSpan.textContent = parseFloat(input.value) + (p.unit ? ' ' + p.unit : '');
        document.getElementById('status').textContent = 'Tweaking ' + data.label;
      });
      
      div.appendChild(label);
      div.appendChild(input);
      div.appendChild(gloss);
      paramsDiv.appendChild(div);
    });
  });
  
  document.getElementById('status').textContent = data.label + ' loaded. Adjust sliders, then press Play.';
  document.getElementById('codeArea').style.display = 'none';
}

sel.addEventListener('change', () => loadInstrument(sel.value));
loadInstrument(sel.value);

// ── Play ──
document.getElementById('playBtn').addEventListener('click', async () => {
  if (!currentInstrument) return;
  if (audioCtx.state === 'suspended') await audioCtx.resume();
  
  const v = {};
  Object.keys(sliders).forEach(key => { v[key] = parseFloat(sliders[key].input.value); });
  const now = audioCtx.currentTime;
  const vol = 1.0;
  
  if (currentInstrument === 'bongo_low' || currentInstrument === 'bongo_high') {
    const master = audioCtx.createGain();
    master.gain.setValueAtTime(vol, now);
    master.connect(audioCtx.destination);
    
    // 1. Fundamental
    const o1 = audioCtx.createOscillator();
    const g1 = audioCtx.createGain();
    o1.type = 'sine';
    o1.frequency.setValueAtTime(v.baseFreq * v.pitchBend, now);
    o1.frequency.exponentialRampToValueAtTime(v.baseFreq, now + 0.025);
    g1.gain.setValueAtTime(v.bodyVol, now);
    g1.gain.exponentialRampToValueAtTime(0.001, now + v.bodyDecay);
    o1.connect(g1); g1.connect(master);
    o1.start(now); o1.stop(now + v.bodyDecay);
    
    // 2. Overtone
    const o2 = audioCtx.createOscillator();
    const g2 = audioCtx.createGain();
    o2.type = 'triangle';
    o2.frequency.setValueAtTime(v.baseFreq * v.overRatio * v.pitchBend, now);
    o2.frequency.exponentialRampToValueAtTime(v.baseFreq * v.overRatio, now + 0.025);
    g2.gain.setValueAtTime(v.overVol, now);
    g2.gain.exponentialRampToValueAtTime(0.001, now + v.bodyDecay * v.overDecay);
    o2.connect(g2); g2.connect(master);
    o2.start(now); o2.stop(now + v.bodyDecay * v.overDecay);
    
    // 3. Impact noise
    const noise = acquireNoise(audioCtx);
    if (noise) {
      const nf = audioCtx.createBiquadFilter();
      nf.type = 'bandpass';
      nf.frequency.setValueAtTime(v.noiseFreq, now);
      nf.Q.setValueAtTime(v.noiseQ, now);
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(v.noiseVol, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + v.noiseDecay);
      noise.connect(nf); nf.connect(ng); ng.connect(master);
      noise.start(now);
    }
    master.gain.exponentialRampToValueAtTime(0.001, now + v.bodyDecay + 0.05);
  }
  
  else if (currentInstrument === 'synth_kick') {
    const sub = audioCtx.createOscillator();
    const sg = audioCtx.createGain();
    sub.type = 'sine';
    sub.frequency.setValueAtTime(v.bodyFreq, now);
    sub.frequency.exponentialRampToValueAtTime(v.bodyEndFreq, now + v.bodySweep);
    sg.gain.setValueAtTime(vol * v.bodyVol, now);
    sg.gain.exponentialRampToValueAtTime(0.001, now + v.bodyDecay);
    sub.connect(sg); sg.connect(audioCtx.destination);
    sub.start(now); sub.stop(now + v.bodyDecay);
    
    const noise = acquireNoise(audioCtx);
    if (noise) {
      const nf = audioCtx.createBiquadFilter();
      nf.type = 'bandpass';
      nf.frequency.setValueAtTime(v.clickFreq, now);
      nf.Q.setValueAtTime(v.clickQ, now);
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(vol * v.clickVol, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + v.clickDecay);
      noise.connect(nf); nf.connect(ng); ng.connect(audioCtx.destination);
      noise.start(now);
    }
  }
  
  else if (currentInstrument === 'snare' || currentInstrument === 'electronic_snare') {
    // Body oscillator
    const osc = audioCtx.createOscillator();
    const og = audioCtx.createGain();
    osc.type = currentInstrument === 'electronic_snare' ? 'sine' : 'triangle';
    if (currentInstrument === 'electronic_snare') {
      osc.frequency.setValueAtTime(v.bodyFreq, now);
      osc.frequency.exponentialRampToValueAtTime(v.bodyEndFreq, now + v.bodySweep);
    } else {
      osc.frequency.setValueAtTime(v.bodyFreq, now);
    }
    og.gain.setValueAtTime(vol * v.bodyVol, now);
    og.gain.exponentialRampToValueAtTime(0.001, now + v.bodyDecay);
    osc.connect(og); og.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + v.bodyDecay);
    
    // Noise
    const noise = acquireNoise(audioCtx);
    if (noise) {
      const nf = audioCtx.createBiquadFilter();
      const isBP = currentInstrument === 'electronic_snare';
      nf.type = isBP ? 'bandpass' : 'highpass';
      nf.frequency.setValueAtTime(v.noiseFreq, now);
      if (isBP) nf.Q.setValueAtTime(v.noiseQ, now);
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(vol * v.noiseVol, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + v.noiseDecay);
      noise.connect(nf); nf.connect(ng); ng.connect(audioCtx.destination);
      noise.start(now);
    }
  }
  
  else if (currentInstrument.startsWith('conga_')) {
    const master = audioCtx.createGain();
    master.gain.setValueAtTime(vol, now);
    master.connect(audioCtx.destination);
    
    // Fundamental
    const o1 = audioCtx.createOscillator();
    const g1 = audioCtx.createGain();
    o1.type = 'sine';
    o1.frequency.setValueAtTime(v.baseFreq * (v.bodyPitchBend || 1.2), now);
    o1.frequency.exponentialRampToValueAtTime(v.baseFreq, now + 0.03);
    g1.gain.setValueAtTime(v.bodyVol, now);
    g1.gain.exponentialRampToValueAtTime(0.001, now + v.bodyDecay);
    o1.connect(g1); g1.connect(master);
    o1.start(now); o1.stop(now + v.bodyDecay);
    
    // Overtone 1
    const o2 = audioCtx.createOscillator();
    const g2 = audioCtx.createGain();
    o2.type = 'triangle';
    o2.frequency.setValueAtTime(v.baseFreq * v.overRatio1, now);
    g2.gain.setValueAtTime(v.overVol1, now);
    g2.gain.exponentialRampToValueAtTime(0.001, now + v.bodyDecay * 0.8);
    o2.connect(g2); g2.connect(master);
    o2.start(now); o2.stop(now + v.bodyDecay * 0.8);
    
    if (v.overRatio2) {
      const o3 = audioCtx.createOscillator();
      const g3 = audioCtx.createGain();
      o3.type = 'triangle';
      o3.frequency.setValueAtTime(v.baseFreq * v.overRatio2, now);
      g3.gain.setValueAtTime(v.overVol2, now);
      g3.gain.exponentialRampToValueAtTime(0.001, now + v.bodyDecay * 0.6);
      o3.connect(g3); g3.connect(master);
      o3.start(now); o3.stop(now + v.bodyDecay * 0.6);
    }
    
    slap: if (v.slapFreq) {
      const noise = acquireNoise(audioCtx);
      if (!noise) break slap;
      const nf = audioCtx.createBiquadFilter();
      nf.type = 'bandpass';
      nf.frequency.setValueAtTime(v.slapFreq, now);
      if (v.slapQ) nf.Q.setValueAtTime(v.slapQ, now);
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(vol * v.slapVol, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + v.slapDecay);
      noise.connect(nf); nf.connect(ng); ng.connect(master);
      noise.start(now);
    }
    master.gain.exponentialRampToValueAtTime(0.001, now + v.bodyDecay + 0.05);
  }
  
  else if (currentInstrument === 'timbale') {
    const osc = audioCtx.createOscillator();
    const og = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(v.bodyFreq, now);
    osc.frequency.exponentialRampToValueAtTime(v.bodyEndFreq, now + v.bodySweep);
    og.gain.setValueAtTime(0.001, now);
    og.gain.linearRampToValueAtTime(vol * v.bodyVol, now + 0.003);
    og.gain.exponentialRampToValueAtTime(0.001, now + v.bodyDecay);
    osc.connect(og); og.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + v.bodyDecay);
    
    const noise = acquireNoise(audioCtx);
    if (noise) {
      const nf = audioCtx.createBiquadFilter();
      nf.type = 'highpass';
      nf.frequency.setValueAtTime(v.noiseFreq, now);
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(vol * v.noiseVol, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + v.noiseDecay);
      noise.connect(nf); nf.connect(ng); ng.connect(audioCtx.destination);
      noise.start(now);
    }
  }
  
  else if (currentInstrument === 'cajon_bass') {
    const osc = audioCtx.createOscillator();
    const og = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(v.bodyFreq, now);
    osc.frequency.exponentialRampToValueAtTime(v.bodyEndFreq, now + v.bodySweep);
    og.gain.setValueAtTime(vol * v.bodyVol, now);
    og.gain.exponentialRampToValueAtTime(0.001, now + v.bodyDecay);
    osc.connect(og); og.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + v.bodyDecay);
    
    const res = audioCtx.createOscillator();
    const rg = audioCtx.createGain();
    res.type = 'triangle';
    res.frequency.setValueAtTime(v.resFreq, now);
    res.frequency.exponentialRampToValueAtTime(v.resEndFreq, now + v.resSweep);
    rg.gain.setValueAtTime(vol * v.resVol, now);
    rg.gain.exponentialRampToValueAtTime(0.001, now + v.bodyDecay);
    res.connect(rg); rg.connect(audioCtx.destination);
    res.start(now); res.stop(now + v.bodyDecay);
  }
  
  else if (currentInstrument === 'cajon_slap' || currentInstrument === 'slap') {
    const noise = acquireNoise(audioCtx);
    if (noise) {
      const nf = audioCtx.createBiquadFilter();
      nf.type = 'bandpass';
      nf.frequency.setValueAtTime(v.noiseFreq, now);
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(vol * v.noiseVol, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + v.noiseDecay);
      noise.connect(nf); nf.connect(ng); ng.connect(audioCtx.destination);
      noise.start(now);
    }
    const osc = audioCtx.createOscillator();
    const og = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(v.bodyFreq, now);
    if (v.bodyEndFreq) osc.frequency.exponentialRampToValueAtTime(v.bodyEndFreq, now + v.bodySweep);
    og.gain.setValueAtTime(vol * v.bodyVol, now);
    og.gain.exponentialRampToValueAtTime(0.001, now + v.bodyDecay);
    osc.connect(og); og.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + v.bodyDecay);
  }
  
  document.getElementById('status').textContent = 'Playing ' + instruments[currentInstrument].label;
});

// ── Copy as code ──
document.getElementById('copyBtn').addEventListener('click', () => {
  if (!currentInstrument) return;
  const v = {};
  Object.keys(sliders).forEach(key => { v[key] = JSON.parse(JSON.stringify(parseFloat(sliders[key].input.value))); });
  
  let code = `// ${instruments[currentInstrument].label} — tuned values\n`;
  code += `function play${currentInstrument.replace(/_./g, m => m[1].toUpperCase()).replace(/^./, m => m.toUpperCase())}(state, now, vol` +
    (currentInstrument === 'bongo_low' || currentInstrument === 'bongo_high' || currentInstrument.startsWith('conga_') || currentInstrument === 'timbale' || currentInstrument === 'cajon_bass' || currentInstrument === 'cajon_slap' ? ', channelName' : '') + `) {\n`;
  
  Object.keys(v).forEach(k => {
    code += `  // ${k} = ${v[k]}\n`;
  });
  
  code += `}\n`;
  
  document.getElementById('codeArea').value = code;
  document.getElementById('codeArea').style.display = 'block';
  document.getElementById('status').textContent = 'Placeholder generated. Copy and paste into instruments.js.';
});
</script>
